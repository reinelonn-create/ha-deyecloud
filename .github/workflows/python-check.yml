name: Python Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile integration
        run: python -m compileall custom_components/deyecloud
